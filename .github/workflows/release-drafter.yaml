name: Release Drafter

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  release:
    types: [published]

# Permissions for default token (secrets.GITHUB_TOKEN)
permissions:
  contents: read

jobs:
  update_release_draft:
    permissions:
      # write permission required to create a github release
      contents: write
      # write permission required for autolabeler
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml # the default, loads '.github/release-drafter.yml'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
