name: CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: CI Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Update environment
        run: uv sync --all-extras --dev

      - name: Run linter
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Check typing
        run: uv run ty check
