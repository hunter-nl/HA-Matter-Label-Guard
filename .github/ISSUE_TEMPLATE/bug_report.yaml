---
name: "Bug report"
description: "Report a reproducible problem or regression"
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please search [existing issues](https://github.com/hunter-nl/HA-Matter-Label-Guard/issues) before opening a new one. Do not use this form for security vulnerabilities; follow the reporting instructions in `SECURITY.md` instead.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This report describes one reproducible problem.
          required: true
        - label: I enabled debug logging and removed any sensitive information from the logs below.
          required: true

  - type: input
    id: version
    attributes:
      label: "Matter Label Guard version"
      description: "Matter Label Guard version that shows the problem."
      placeholder: v1.0.4
    validations:
      required: true

  - type: textarea
    id: system-health
    attributes:
      label: "System Health details"
      description: "Paste the System Health information from Home Assistant. See https://www.home-assistant.io/more-info/system-health/#github-issues for instructions."
      render: text
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: "What happened?"
      description: "Describe the observed behavior, including any error message."
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: "What did you expect to happen?"
      description: "Describe the expected behavior."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to reproduce"
      description: "Give the smallest set of steps that reliably produces the problem."
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Debug logs"
      description: "Enable debug logging as described at https://www.home-assistant.io/integrations/logger/, then include relevant logs from Home Assistant startup through the failure. Redact identifiers, addresses, and other sensitive data."
      render: text
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: "Diagnostics or additional context"
      description: "Attach a diagnostics dump (https://www.home-assistant.io/integrations/diagnostics/), screenshots, or other relevant context. Remove sensitive information before uploading."
